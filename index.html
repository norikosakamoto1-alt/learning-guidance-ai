
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習ガイダンスAI</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px #0001;
    }
    h1 {
      color: #234b73;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 120px;
      padding: 12px;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      padding: 12px 24px;
      background: #234b73;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #response {
      margin-top: 20px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>学習ガイダンスAI</h1>

    <p>学習についての質問を入力してください。</p>

    <textarea
      id="question"
      maxlength="1000"
      placeholder="例：プロジェクトのリスクをどう管理すればよいですか？"
    ></textarea>

    <button id="askButton" onclick="askAI()">
      質問する
    </button>

    <div id="response" role="status" aria-live="polite"></div>
  </div>

  <script>
    async function askAI() {
      const question = document
        .getElementById("question").value.trim();

      const response = document
        .getElementById("response");

      const button = document
        .getElementById("askButton");

      if (!question) {
        response.textContent =
          "質問を入力してください。";
        return;
      }

      response.textContent =
        "AIが回答を考えています...";

      button.disabled = true;

      try {
        const result = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        const data = await result.json();

        if (!result.ok) {
          throw new Error(
            data.error || "通信に失敗しました。"
          );
        }

        response.textContent =
          data.answer || "回答を取得できませんでした。";

      } catch (error) {
        response.textContent =
          "エラーが発生しました：" + error.message;

      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
